[package]
name = "mousevpn-admin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
mousevpn-config = { path = "../config" }
mousevpn-account-client = { path = "../account-client" }
mousevpn-crypto = { path = "../crypto" }
mousevpn-profile-cli = { path = "../profile-cli" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
subtle = "2.6"
tempfile = "3.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
toml = "0.8"
zeroize = "1.8"

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
