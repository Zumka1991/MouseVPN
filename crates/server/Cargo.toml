[package]
name = "mousevpn-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "mousevpn-server"
path = "src/main.rs"

[[bin]]
name = "relay-agent"
path = "src/bin/relay-agent.rs"

[dependencies]
mousevpn-admin-api = { path = "../admin-api" }
mousevpn-account-client = { path = "../account-client" }
mousevpn-config = { path = "../config" }
mousevpn-crypto = { path = "../crypto" }
mousevpn-data-plane = { path = "../data-plane" }
mousevpn-linux-platform = { path = "../linux-platform" }
mousevpn-morph = { path = "../morph" }
mousevpn-speedy = { path = "../speedy" }
mousevpn-protocol = { path = "../protocol" }
mousevpn-transport = { path = "../transport" }
nix = { version = "0.30", features = ["net", "poll", "socket", "uio"] }
socket2 = "0.6"

[dev-dependencies]
mousevpn-client-wire = { path = "../client-wire" }
mousevpn-linux-client = { path = "../linux-client" }
mousevpn-transport = { path = "../transport" }
tempfile = "3.26"

[lints]
workspace = true
