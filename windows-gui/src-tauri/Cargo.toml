[package]
name = "mousevpn-windows-gui"
version = "0.2.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
full-tunnel-only = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
dirs = "6.0"
mousevpn-config = { path = "../../crates/config" }
mousevpn-account-client = { path = "../../crates/account-client" }
mousevpn-crypto = { path = "../../crates/crypto" }
mousevpn-profile-cli = { path = "../../crates/profile-cli" }
mousevpn-windows-client = { path = "../../crates/windows-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
toml = "1.0"
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[lints]
workspace = true
