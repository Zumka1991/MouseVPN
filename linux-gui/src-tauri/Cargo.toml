[package]
name = "mousevpn-linux-gui"
version = "0.2.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "mousevpn-linux-gui"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
dirs = "6.0"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3", features = ["blocking"] }
mousevpn-account-client = { path = "../../crates/account-client" }
mousevpn-crypto = { path = "../../crates/crypto" }
mousevpn-config = { path = "../../crates/config" }
mousevpn-linux-client = { path = "../../crates/linux-client" }
mousevpn-profile-cli = { path = "../../crates/profile-cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
toml = "1.0"
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
