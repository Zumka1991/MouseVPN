[workspace]
members = [
    "crates/protocol",
    "crates/crypto",
    "crates/morph",
    "crates/speedy",
    "crates/client-wire",
    "crates/transport",
    "crates/client-core",
    "crates/config",
    "crates/data-plane",
    "crates/linux-client",
    "crates/linux-platform",
    "crates/server",
    "crates/admin-api",
    "crates/control-plane",
    "crates/account-client",
    "crates/android-native",
    "crates/apple-native",
    "crates/macos-client",
    "crates/profile-cli",
    "crates/device-cli",
    "crates/proxy-client",
    "crates/windows-client",
    "linux-gui/src-tauri",
    "windows-gui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

# The packet path is small and hot: whole-program inlining across the protocol,
# crypto and data-plane crates is worth the longer build.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
